<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prioridad de las fuentes -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>FiraCode Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>FiraCode Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>

